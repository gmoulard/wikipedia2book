name: Benchmark

on:
  workflow_dispatch:
    inputs:
      level:
        description: "min : 2 PDF (50 et 200 pages) ; max : version détaillée"
        type: choice
        options: [min, max]
        default: min
      save_reference:
        description: "Enregistrer ces mesures comme nouvelle référence (main uniquement)"
        type: boolean
        default: false
      repeat:
        description: "Générations par scénario (0 : celles du niveau, 3 en min, 2 en max)"
        type: number
        default: 0

concurrency:
  group: benchmark
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BENCHMARK_ENVIRONMENT: "GitHub Actions ubuntu-latest, image Docker de production"
      LEVEL: ${{ inputs.level }}
      SAVE_REFERENCE: ${{ inputs.save_reference && github.ref == 'refs/heads/main' }}
      REPEAT: ${{ inputs.repeat }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "$(grep '^pypdf==' requirements.txt)"
      - name: Build the production image
        run: docker build --build-arg GIT_COMMIT="$(git rev-parse HEAD)" -t wikipedia2book-benchmark .
      - name: Start the application
        run: |
          docker run -d --name app -p 8000:8000 wikipedia2book-benchmark
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1
      - name: Run the benchmark
        run: |
          args="--level $LEVEL --report benchmark-report.md"
          [ "$SAVE_REFERENCE" = true ] && args="$args --save-reference"
          [ "${REPEAT:-0}" -gt 0 ] && args="$args --repeat $REPEAT"
          status=0
          python scripts/benchmark.py $args || status=$?
          [ -f benchmark-report.md ] && cat benchmark-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Application logs
        if: failure()
        run: docker logs app | tail -100
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-report
          path: benchmark-report.md
          if-no-files-found: ignore
      - name: Save the reference on main
        if: env.SAVE_REFERENCE == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/benchmark/reference.json
          git diff --cached --quiet && exit 0
          git commit -m "benchmark: référence $LEVEL $(date -u +%F)${REPEAT:+ sur $REPEAT générations}"
          for attempt in 1 2 3; do
            git fetch -q origin main && git rebase -q origin/main && git push -q origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
