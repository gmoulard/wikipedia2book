name: Tests and Toolforge deploy

on:
  push:
    branches: [main, production-toolforge]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref == 'refs/heads/production-toolforge' && 'toolforge-deploy' || github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  deploy:
    needs: test
    if: github.ref == 'refs/heads/production-toolforge' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          TOOLFORGE_SSH_KEY: ${{ secrets.TOOLFORGE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TOOLFORGE_SSH_KEY" > ~/.ssh/toolforge
          chmod 600 ~/.ssh/toolforge
          echo "login.toolforge.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHHCaBsit1GY3TeucMi3gDEIpQ8uNhokVa0dr/tM6PZa" > ~/.ssh/known_hosts
      - name: Hourly statistics before restart
        continue-on-error: true
        run: |
          git fetch -q origin main
          git worktree add -q --detach ../main origin/main
          bash ../main/scripts/update-stats.sh deploy
      - name: Build and restart on Toolforge
        env:
          WIKIPEDIA2BOOK_MONITOR_TOKEN: ${{ secrets.WIKIPEDIA2BOOK_MONITOR_TOKEN }}
          WIKIPEDIA2BOOK_OAUTH_CLIENT_ID: ${{ secrets.WIKIPEDIA2BOOK_OAUTH_CLIENT_ID }}
          WIKIPEDIA2BOOK_OAUTH_CLIENT_SECRET: ${{ secrets.WIKIPEDIA2BOOK_OAUTH_CLIENT_SECRET }}
        run: |
          # NE PAS passer ces secrets en argument de ssh ni de toolforge : ils seraient visibles des autres utilisateurs du bastion ; ils voyagent dans le script lu sur l'entrée standard.
          {
            for name in WIKIPEDIA2BOOK_MONITOR_TOKEN WIKIPEDIA2BOOK_OAUTH_CLIENT_ID WIKIPEDIA2BOOK_OAUTH_CLIENT_SECRET; do
              printf 'export %s=%q\n' "$name" "${!name}"
            done
            cat scripts/toolforge-deploy.sh
          } | ssh -i ~/.ssh/toolforge -o IdentitiesOnly=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            gm474d6f756c617264@login.toolforge.org \
            "become wikipedia2book bash -s"
