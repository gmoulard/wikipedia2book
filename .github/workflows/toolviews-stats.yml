name: Toolviews stats

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: toolviews-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure SSH
        env:
          TOOLFORGE_SSH_KEY: ${{ secrets.TOOLFORGE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TOOLFORGE_SSH_KEY" > ~/.ssh/toolforge
          chmod 600 ~/.ssh/toolforge
          echo "login.toolforge.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHHCaBsit1GY3TeucMi3gDEIpQ8uNhokVa0dr/tM6PZa" > ~/.ssh/known_hosts
      - name: Update daily and hourly statistics on main
        run: bash scripts/update-stats.sh daily
