name: Toolviews stats

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

concurrency:
  group: toolviews-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update toolviews.csv and stats.md on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/toolviews_stats.py toolviews.csv
          python scripts/toolviews_chart.py toolviews.csv stats.md
          git add toolviews.csv stats.md
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "stats: toolviews $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
