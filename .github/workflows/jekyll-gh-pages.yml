# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  schedule:
    - cron: "17 4 * * *"

  workflow_run:
    workflows: ["Toolviews stats", "Tests and Toolforge deploy"]
    types: [completed]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_branch == 'production-toolforge' ||
      (github.event.workflow_run.name == 'Toolviews stats' && github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Usage statistics page
        run: |
          python3 scripts/toolviews_chart.py docs/toolviews.csv docs/stats.md --hourly docs/toolforge_hourly.csv --generations docs/toolforge_generations.csv
      - name: Day of the example PDF
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Example PDF of the day (cache)
        id: example-cache
        uses: actions/cache@v4
        with:
          path: example-pdf
          key: example-pdf-${{ steps.day.outputs.day }}-${{ hashFiles('docs/static/Wrecks-of-Saint-Pierre-harbor.json') }}
      - name: Example PDF generated by Toolforge
        if: steps.example-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p example-pdf
          curl --fail --silent --show-error --retry 3 --retry-delay 30 --retry-all-errors --max-time 900 \
            -H "Content-Type: application/json" -H "X-Wikipedia2Book-Client: github-pages-example" \
            --data-binary @docs/static/Wrecks-of-Saint-Pierre-harbor.json \
            -o example-pdf/new.pdf \
            "https://wikipedia2book.toolforge.org/api/pdf/from-json?language=en"
          size=$(stat -c %s example-pdf/new.pdf)
          head -c 5 example-pdf/new.pdf | grep -q '^%PDF-' || { echo "::error::Réponse de Toolforge qui n'est pas un PDF"; exit 1; }
          tail -c 1024 example-pdf/new.pdf | grep -q '%%EOF' || { echo "::error::PDF incomplet"; exit 1; }
          [ "$size" -gt 1000000 ] || { echo "::error::PDF trop petit ($size octets)"; exit 1; }
          mv example-pdf/new.pdf example-pdf/Wrecks-of-Saint-Pierre-harbor.pdf
          echo "PDF d'exemple généré : $size octets"
      - name: Publish the example PDF
        run: |
          if [ -f example-pdf/Wrecks-of-Saint-Pierre-harbor.pdf ]; then
            cp example-pdf/Wrecks-of-Saint-Pierre-harbor.pdf docs/static/Wrecks-of-Saint-Pierre-harbor.pdf
            echo "PDF d'exemple du $(date -u +%F) publié"
          else
            rm -rf example-pdf
            echo "::warning::PDF d'exemple non généré aujourd'hui : le site garde celui du dépôt"
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
