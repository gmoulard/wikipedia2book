name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit --requirement requirements.txt --strict --desc

  python-static:
    name: Python static analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit --recursive app --severity-level medium --confidence-level medium
      - name: bandit scripts (operator URLs, B310 skipped)
        run: bandit --recursive scripts --severity-level medium --confidence-level medium --skip B310

  security-tests:
    name: Security unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_security -v

  container:
    name: Container image (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t wikipedia2book:security .
      # NE PAS revenir à un tag de trivy-action : ses tags ont été détournés en 2026 ; épinglé sur le commit de v0.36.0.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: wikipedia2book:security
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
