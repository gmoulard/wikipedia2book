title: Wikipedia2Book
description: Livres PDF imprimables à partir de pages Wikimédia — documentation / documentation
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings

logo: /static/Wikipedia2bookLogo.png
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Haut de page / Back to top
aux_links:
  Wikipedia2Book: https://wikipedia2book.toolforge.org/
  GitHub: https://github.com/gmoulard/wikipedia2book
aux_links_new_tab: true
footer_content: Wikipedia2Book — GNU AGPL v3.0 — <a href="https://github.com/gmoulard/wikipedia2book">github.com/gmoulard/wikipedia2book</a>

# NE PAS réactiver la compression du HTML de Just the Docs : elle met chaque page sur une ligne, et le premier commentaire // du script de _includes/head_custom.html avale alors tout le reste (Mermaid et graphique horaire non dessinés).
compress_html:
  ignore:
    envs: all

exclude:
  - serve-docs.ps1

relative_links:
  enabled: true
  collections: false

defaults:
  - scope: { path: "index.md" }
    values: { title: Accueil / Home, nav_order: 1 }
  - scope: { path: "docs.md" }
    values: { title: Documents, nav_order: 2 }
  - scope: { path: "FunctionalSpec.fr.md" }
    values: { title: Spécification fonctionnelle, parent: "Fonctionnel / Functional", nav_order: 1 }
  - scope: { path: "FunctionalSpec.en.md" }
    values: { title: Functional specification, parent: "Fonctionnel / Functional", nav_order: 2 }
  - scope: { path: "CHANGELOG.fr.md" }
    values: { title: Historique des versions, parent: "Fonctionnel / Functional", nav_order: 3 }
  - scope: { path: "CHANGELOG.en.md" }
    values: { title: Version history, parent: "Fonctionnel / Functional", nav_order: 4 }
  - scope: { path: "helpSearch.fr.md" }
    values: { title: "Aide à la recherche / Search help", parent: "Fonctionnel / Functional", nav_order: 5, has_children: true }
  - scope: { path: "helpSearch.en.md" }
    values: { title: "English", parent: "Aide à la recherche / Search help", nav_order: 1, grand_parent: "Fonctionnel / Functional" }
  - scope: { path: "helpSearch.de.md" }
    values: { title: "Deutsch", parent: "Aide à la recherche / Search help", nav_order: 2, grand_parent: "Fonctionnel / Functional" }
  - scope: { path: "helpSearch.es.md" }
    values: { title: "Español", parent: "Aide à la recherche / Search help", nav_order: 3, grand_parent: "Fonctionnel / Functional" }
