<style>
  .bench-new { display: inline-block; padding: 0 0.45em; border-radius: 0.6em; background: #1a7f37; color: #fff; font-size: 0.85em; white-space: nowrap; }
</style>
<style>
  @media (min-width: 66.5rem) {
    .side-bar { width: 16.5rem; }
    .side-bar + .main { margin-left: 16.5rem; }
    .main { max-width: none; }
    .side-bar .site-header, .side-bar .site-nav, .side-bar .site-footer { width: 16.5rem; }
  }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
<style>
  .nav-list-item.has-flag { display: flex; align-items: center; }
  .nav-list-item.has-flag > .nav-list-link { flex: 0 1 auto; padding-right: 0; }
  .nav-flag { display: inline-flex; flex: 0 0 auto; margin-left: 0.25rem; line-height: 0; }
  #site-nav .fi { width: 1.1rem; line-height: 0.8rem; margin-right: 0.4rem; box-shadow: 0 0 0 1px #d7d7d7; vertical-align: -0.1em; }
  .nav-flag .fi { margin-right: 0; }
</style>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const flagIcon = (country) => `<span class="fi fi-${country}" aria-hidden="true"></span>`;
    const pathOf = (link) => link.getAttribute("href") ?? location.pathname;
    const translations = {
      "FunctionalSpec.en.html": { href: "FunctionalSpec.fr.html", label: "Spécification fonctionnelle (français)" },
      "TechnicalSpec.en.html": { href: "TechnicalSpec.fr.html", label: "Spécification technique (français)" },
    };
    const helpCountries = { fr: "fr", en: "gb", de: "de", es: "es", it: "it", pt: "pt", nl: "nl", tr: "tr", zh: "cn", ja: "jp", fa: "ir", ar: "arab" };
    const links = [...document.querySelectorAll("#site-nav a.nav-list-link")];
    // NE PAS lire seulement l'attribut href : Just the Docs le retire du lien de la page affichée.
    links.forEach((link) => {
      const path = pathOf(link);
      const name = path.split("/").pop();
      const translation = translations[name];
      if (translation) {
        const anchor = document.createElement("a");
        anchor.className = "nav-flag";
        anchor.href = path.replace(/[^/]*$/, translation.href);
        anchor.title = translation.label;
        anchor.setAttribute("aria-label", translation.label);
        anchor.innerHTML = flagIcon("fr");
        link.parentElement.classList.add("has-flag");
        link.after(anchor);
      }
      const help = name.match(/^helpSearch\.([a-z]{2})\.html$/);
      if (!help) return;
      if (help[1] === "fr") {
        const children = link.parentElement.querySelector(":scope > .nav-list");
        if (!children) return;
        const item = document.createElement("li");
        item.className = "nav-list-item";
        const french = document.createElement("a");
        french.className = "nav-list-link";
        french.href = path;
        french.innerHTML = `${flagIcon("fr")}Français`;
        if (!link.getAttribute("href")) french.classList.add("active");
        item.append(french);
        children.prepend(item);
      } else {
        link.insertAdjacentHTML("afterbegin", flagIcon(helpCountries[help[1]]));
      }
    });
  });
</script>
<style>
  .doc-language { margin: 0 1rem; align-self: center; font: inherit; font-size: 0.875rem; padding: 0.2rem 0.4rem; border: 1px solid #d7d7d7; border-radius: 4px; background: transparent; color: inherit; }
</style>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("#site-nav > .nav-list > .nav-list-item").forEach((item) => {
      const expander = item.querySelector(":scope > .nav-list-expander");
      if (!expander) return;
      item.classList.add("active");
      expander.setAttribute("aria-expanded", "true");
    });
  });
</script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const names = { fr: "Français", en: "English", de: "Deutsch", es: "Español", it: "Italiano", pt: "Português", nl: "Nederlands", tr: "Türkçe", zh: "中文", ja: "日本語", fa: "فارسی", ar: "العربية" };
    const translations = { helpSearch: Object.keys(names), FunctionalSpec: ["fr", "en"], TechnicalSpec: ["fr", "en"] };
    const match = location.pathname.match(/\/([A-Za-z]+)\.([a-z]{2})\.html$/);
    if (!match || !translations[match[1]]?.includes(match[2])) return;
    const [, page, current] = match;
    const main = document.querySelector("#main-content");
    if (main && ["fa", "ar"].includes(current)) {
      main.dir = "rtl";
      main.querySelectorAll("pre, code").forEach((el) => { el.dir = "ltr"; });
    }
    const select = document.createElement("select");
    select.className = "doc-language";
    select.setAttribute("aria-label", "Langue / Language");
    translations[page].forEach((code) => select.add(new Option(names[code], code, false, code === current)));
    select.addEventListener("change", () => { location.href = `${page}.${select.value}.html`; });
    const header = document.querySelector("#main-header");
    if (header) header.insertBefore(select, header.querySelector(".aux-nav"));
    else main?.prepend(select);
  });
</script>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs";

  const blocks = document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid");
  blocks.forEach((block) => {
    const target = block.matches("code") ? block.parentElement : block;
    const diagram = document.createElement("div");
    diagram.className = "mermaid";
    diagram.textContent = block.textContent;
    target.replaceWith(diagram);
  });
  const fitLabels = (root) => {
    // NE PAS retirer : Mermaid calcule la taille des étiquettes d'après la largeur des barres (-1px s'il y a une barre à 0, énorme pour une seule barre)
    root.querySelectorAll('svg[aria-roledescription="xychart"]').forEach((svg) => {
      const bar = svg.querySelector('g[class^="bar-plot"] rect');
      const labels = [...svg.querySelectorAll('g[class^="bar-plot"] text')];
      if (!bar || !labels.length) return;
      const longest = Math.max(...labels.map((label) => label.textContent.length));
      const size = Math.max(6, Math.min(12, bar.width.baseVal.value / (longest * 0.62)));
      labels.forEach((label) => label.setAttribute("font-size", `${size}px`));
    });
  };
  const hourlyData = document.getElementById("hourly-data");
  const hourlyDiagram = [...document.querySelectorAll("div.mermaid")].find((diagram) => diagram.textContent.includes('title "Hourly hits'));
  const hourlyText = hourlyDiagram?.textContent;
  if (blocks.length) {
    mermaid.initialize({ startOnLoad: false, theme: window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "default" });
    // NE PAS attendre la réponse de l'application avant ce rendu : après un await, Mermaid 11.17.2 laisse le graphique horaire en texte, sans erreur
    await mermaid.run({ querySelector: ".mermaid" });
    fitLabels(document);
  }
  if (hourlyData && hourlyDiagram) {
    const note = document.createElement("p");
    hourlyDiagram.after(note);
    try {
      const response = await fetch("https://wikipedia2book.toolforge.org/api/stats/hourly", { cache: "no-store", signal: AbortSignal.timeout(5000) });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const live = (await response.json()).hours;
      const hits = JSON.parse(hourlyData.dataset.hours);
      for (const [hour, count] of Object.entries(live)) hits[hour] = Math.max(hits[hour] || 0, count);
      const toDate = (hour) => new Date(`${hour}:00:00Z`);
      const keys = Object.keys(hits).sort();
      const end = toDate(keys[keys.length - 1]);
      const first = new Date(Math.max(end - 35 * 3600e3, toDate(keys[0])));
      const hours = [];
      for (let time = first.getTime(); time <= end.getTime(); time += 3600e3) hours.push(new Date(time));
      const key = (date) => date.toISOString().slice(0, 13);
      const pad = (value) => String(value).padStart(2, "0");
      const label = (date) => `${pad(date.getUTCDate())}/${pad(date.getUTCMonth() + 1)} ${pad(date.getUTCHours())}h`;
      const values = hours.map((date) => hits[key(date)] || 0);
      const text = hourlyText
        .replace(/^ {4}title .*$/m, `    title "Hourly hits (UTC) ${label(hours[0])} - ${label(hours[hours.length - 1])}"`)
        .replace(/^ {4}x-axis .*$/m, `    x-axis [${hours.map((date) => `"${pad(date.getUTCHours())}"`).join(", ")}]`)
        .replace(/^ {4}y-axis .*$/m, `    y-axis "Hits" 0 --> ${Math.ceil(Math.max(...values, 1) * 1.15)}`)
        .replace(/^ {4}bar .*$/m, `    bar [${values.join(", ")}]`);
      hourlyDiagram.innerHTML = (await mermaid.render("hourly-live", text)).svg;
      fitLabels(hourlyDiagram);
      note.textContent = `Live / en direct : ${label(end)} UTC (current hour in progress / heure en cours incomplète).`;
    } catch (error) {
      note.textContent = `Live hours unavailable / heures en direct indisponibles (${error.message}) : chart as of the last collection / graphique au dernier relevé.`;
    }
  }
</script>
